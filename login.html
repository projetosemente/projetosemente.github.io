<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Projeto Semente</title>

    <meta name="description"
          content="Área de acesso do Projeto Semente">

    <link rel="icon"
          type="image/png"
          href="assets/img/favicon.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="assets/css/login.css">
</head>

<body>

<main class="login-page">

    <section class="login-card">

        <div class="login-logo">
            <img src="assets/img/logo1.png"
                 alt="Projeto Semente">
        </div>

        <div class="login-header">
            <span class="login-label">ÁREA RESTRITA</span>

            <h1>Bem-vindo!</h1>

            <p>
                Acesse o sistema do Projeto Semente.
            </p>
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <div class="input-wrapper">

                    <i class="bi bi-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="username"
                        required>

                </div>

            </div>

            <div class="form-group">

                <label for="senha">
                    Senha
                </label>

                <div class="input-wrapper">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        id="mostrarSenha"
                        class="password-toggle"
                        aria-label="Mostrar senha">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>

            <div
                id="loginMensagem"
                class="login-mensagem"
                role="alert">
            </div>

            <button
                type="submit"
                class="btn-login">

                <span>Entrar</span>

                <i class="bi bi-arrow-right"></i>

            </button>

        </form>

        <div class="demo-box">

            <div class="demo-icon">
                <i class="bi bi-info-circle"></i>
            </div>

            <div>
                <strong>Acesso demonstrativo</strong>

                <p>
                    E-mail: <b>admin@projetosemente.com</b><br>
                    Senha: <b>123456</b>
                </p>
            </div>

        </div>

        <a
            href="index.html"
            class="voltar-site">

            <i class="bi bi-arrow-left"></i>

            Voltar para o site

        </a>

    </section>

</main>

<script src="assets/js/login.js"></script>

</body>
</html>
